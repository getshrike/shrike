name: "Shrike verified cleanup"
description: "Report newly dead code caused by a pull request, or open a verified cleanup PR."
inputs:
  mode:
    description: "delta (read-only) or prune (verified cleanup PR)"
    required: false
    default: "delta"
  base:
    description: "Base git ref"
    required: false
    default: ""
  max-items:
    description: "Fail when the delta exceeds this many items (0 disables)"
    required: false
    default: "0"
outputs:
  count:
    description: "Number of newly dead items"
  delta-path:
    description: "Path to the JSON delta artifact"
  outcome:
    description: "Prune outcome"
  receipts:
    description: "Number of receipts written"
runs:
  using: "node24"
  main: "src/main.ts"
