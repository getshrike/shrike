# Cargo dependency policy for Shrike. Kept concise: the crate graph is small
# and the allowlist below is derived from `cargo metadata` for the current
# lockfile. Add a license only with a reviewed reason in the same PR.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
