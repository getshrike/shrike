name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 1.0.0-rc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease and publish under the npm next tag"
        required: false
        default: true
        type: boolean
      publish:
        description: "Publish the attested tarballs to npm after the GitHub release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"
          else
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          npm_tag=latest
          if [ "$prerelease" = "true" ]; then npm_tag=next; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

  cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - run: pnpm run build:ts
      - name: Verify the committed Action bundle is current
        run: git diff --exit-code packages/action/dist/main.cjs
      - run: node scripts/check-package.mjs
      - name: Pack the CLI
        run: |
          set -euo pipefail
          mkdir -p dist/release
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/release"
        working-directory: packages/cli
      - name: Attest the CLI tarball
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/release/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-cli
          path: dist/release/*.tgz
          if-no-files-found: error

  platform:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            runner: ubuntu-latest
            binary: shrike-engine
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            runner: ubuntu-24.04-arm
            binary: shrike-engine
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-15-intel
            binary: shrike-engine
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-15
            binary: shrike-engine
          - target: x86_64-pc-windows-msvc
            platform: win32-x64
            runner: windows-latest
            binary: shrike-engine.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p shrike-engine --target ${{ matrix.target }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Stage the platform package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-platform.mjs \
            --platform "${{ matrix.platform }}" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --version "${{ needs.version.outputs.version }}"
      - name: Pack the platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cd "packages/platform/${{ matrix.platform }}"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/release"
      - name: Copy the standalone engine and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          engine="dist/release/shrike-engine-${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "win32-x64" ]; then engine="$engine.exe"; fi
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$engine"
          node scripts/checksums.mjs --out "$engine.sha256" "$engine"
      - name: Attest the platform artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/shrike-engine-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [version, cli, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          args=(--version "${{ needs.version.outputs.version }}")
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          node scripts/release-notes.mjs "${args[@]}" > dist/release/release-notes.md
      - name: Generate the release manifest
        run: |
          node scripts/release-manifest.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --dir dist/release \
            --commit "$GITHUB_SHA"
      - name: Generate checksums
        run: node scripts/checksums.mjs --out dist/release/SHA256SUMS dist/release/*
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/release/SHA256SUMS.bundle dist/release/SHA256SUMS
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Shrike ${{ needs.version.outputs.version }}
          body_path: dist/release/release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/release/*
          fail_on_unmatched_files: true

  publish:
    needs: [version, release]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Publish the platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            case "$platform" in
              win32-x64) name="getshrike-windows-x64" ;;
              *) name="getshrike-$platform" ;;
            esac
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              continue
            fi
            npm publish "dist/release/$name-$VERSION.tgz" \
              --access public --provenance --tag "$NPM_TAG"
          done
      - name: Publish getshrike
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          NPM_TAG: ${{ needs.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          if npm view "getshrike@$VERSION" version >/dev/null 2>&1; then
            echo "getshrike@$VERSION is already published; skipping"
          else
            npm publish "dist/release/getshrike-$VERSION.tgz" \
              --access public --provenance --tag "$NPM_TAG"
          fi

  smoke:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install from the registry and run both bins
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm install -g "getshrike@$VERSION" --ignore-scripts --no-audit --no-fund; then break; fi
            if [ "$attempt" = "5" ]; then exit 1; fi
            sleep 10
          done
          shrike version --json | node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(0,"utf8")); if(v.version!==process.env.VERSION){console.error(v);process.exit(1)}'
          getshrike version --json | node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(0,"utf8")); if(v.version!==process.env.VERSION){console.error(v);process.exit(1)}'
