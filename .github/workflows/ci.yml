name: ci

on:
  push:
    branches: [main, implementation]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  cross-platform:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm -r typecheck
      - run: cargo build -p shrike-engine
      - run: pnpm test:node
      - run: pnpm run lint
      - run: node scripts/check-docs.mjs
      - run: node scripts/check-links.mjs
      - run: pnpm run build:ts
      - name: Verify the committed Action bundle is current
        run: git diff --exit-code packages/action/dist/main.cjs
      - run: node scripts/check-package.mjs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:ts
      - run: cargo build --release -p shrike-engine
      - name: Stage the host platform package
        run: node scripts/stage-platform.mjs --platform linux-x64 --binary target/release/shrike-engine
      - name: Check the CLI tarball
        run: node scripts/check-package.mjs
      - name: Check the platform tarball
        run: node scripts/check-package.mjs --platform linux-x64
      - name: Install the packed tarballs on a clean machine
        run: node scripts/test-install.mjs

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p shrike-engine
      - run: node scripts/differential.mjs
      - run: node scripts/differential.mjs --fixture fixtures/differential-glob

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo build --release -p shrike-engine
      - run: cargo build -p shrike-engine
      - run: node scripts/check-schemas.mjs
      - run: node scripts/validate-instances.mjs
      - run: node scripts/check-receipts.mjs
      - run: node scripts/check-corpus.mjs
      - run: node scripts/verify-fixtures.mjs
      - run: node scripts/run-fixtures.mjs --engine
      - run: node scripts/corpus-runner.mjs
      - run: node scripts/e2e-prune.mjs
      - name: Determinism
        run: |
          set -euo pipefail
          mkdir -p /tmp/shrike-det
          printf '%s\n' '{"protocolVersion":"1.0","id":"a","command":"analyze","payload":{"root":"fixtures/delta/removed-caller/base","config":{}}}' | target/debug/shrike-engine > /tmp/shrike-det/a.json
          printf '%s\n' '{"protocolVersion":"1.0","id":"b","command":"analyze","payload":{"root":"fixtures/delta/removed-caller/base","config":{}}}' | target/debug/shrike-engine > /tmp/shrike-det/b.json
          diff <(sed 's/"id":"a"/"id":"x"/' /tmp/shrike-det/a.json) <(sed 's/"id":"b"/"id":"x"/' /tmp/shrike-det/b.json)
