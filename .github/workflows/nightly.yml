name: nightly-benchmark

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # Advisory by design: this runs on a shared runner, so timings are noisy.
    # The result is published to the job summary for a human to review; it is
    # never a hard merge gate. See docs/testing.md (Performance).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p shrike-engine
      - run: node benchmarks/generate.mjs --out /tmp/shrike-bench --files 10000
      - run: node benchmarks/harness.mjs --files 10000 | tee benchmark.json
      - name: Publish advisory benchmark result
        run: |
          {
            echo '### Nightly benchmark (advisory)';
            echo;
            echo 'Shared-runner timings are informational and not a merge gate.';
            echo '```json';
            cat benchmark.json;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark.json
